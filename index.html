<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Schedule – Preview</title>
<style>

body{margin:0;font-family:Inter,system-ui,sans-serif;color:#1c2523}
.sec{font-size:11px;font-weight:600;letter-spacing:.6px;color:#51615d;margin:20px 0 8px 2px}
.card{background:#fff;border:1px solid #cfd9d6;border-radius:14px}
.field{display:flex;flex-direction:column;gap:4px;font-size:12px;color:#51615d}
.inp{box-sizing:border-box;height:44px;border:1px solid #b6c4c0;border-radius:10px;padding:0 10px;font:inherit;font-size:14px;color:#1c2523;background:#fff;width:100%}
.seg{display:flex;background:#e6eeec;border-radius:14px;padding:4px}
.seg button{flex:1;min-height:44px;border:0;border-radius:11px;background:transparent;font:inherit;font-weight:600;font-size:14px;color:#51615d;cursor:pointer}
.seg button.on{background:#0f766e;color:#fff}
.pill{min-height:44px;padding:0 14px;border-radius:999px;border:1px solid #b6c4c0;background:#fff;font:inherit;font-size:13px;font-weight:500;color:#1c2523;cursor:pointer}
.pill.on{border-color:#0f766e;background:#e0f2ef;color:#0b5a54;font-weight:600}
.day{width:44px;height:44px;border-radius:14px;border:1px solid #b6c4c0;background:#fff;font:inherit;font-size:12px;font-weight:600;color:#1c2523;cursor:pointer;padding:0}
.day.on{background:#0f766e;border-color:#0f766e;color:#fff}
.err{font-size:12px;color:#b42318;margin-top:6px}
.tcard{border:1px solid #cfd9d6;border-radius:14px;background:#fff;padding:12px}
.tcard.on{border:1.5px solid #0f766e;background:#f1f9f8}
.sw{width:46px;height:28px;border-radius:999px;border:0;background:#b6c4c0;position:relative;cursor:pointer;padding:0;flex:none}
.sw.on{background:#0f766e}
.sw i{position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on i{left:21px}
.slot{background:#fff;border:1px solid #cfd9d6;border-radius:12px;padding:10px;margin-top:8px}
.ghost{min-height:44px;border:1px solid #0f766e;background:#fff;color:#0f766e;border-radius:12px;font:inherit;font-weight:600;font-size:13px;padding:0 14px;cursor:pointer}
.del{width:44px;height:44px;border:0;background:transparent;color:#51615d;cursor:pointer;border-radius:10px;padding:0}
.chip{min-height:32px;padding:0 10px;border-radius:999px;border:1px solid #b6c4c0;background:#fff;font:inherit;font-size:12px;color:#1c2523;cursor:pointer}
.chip.off{border-color:#b42318;color:#b42318;background:#fdecea;text-decoration:line-through}
.badge{font-size:11px;padding:4px 10px;border-radius:999px;background:#e0f2ef;color:#0b5a54}
.badge.x{background:#fdecea;color:#b42318}

body{background:#e9efee}
#app{max-width:430px;margin:0 auto;background:#f4f8f7;min-height:100vh;padding-bottom:40px}
.row{display:flex;align-items:center;gap:10px}
</style>
</head>
<body>
<div id="app"></div>
<script>
const WD=['Mon','Tue','Wed','Thu','Fri','Sat','Sun'],FULL=['Monday','Tuesday','Wednesday','Thursday','Friday','Saturday','Sunday'];
const META=[{key:'hospital',title:'Hospital visit',sub:'In-person at the hospital'},{key:'online',title:'Online consultation',sub:'Video call with the patient'},{key:'home',title:'Home visit',sub:'Doctor visits the patient'}];
const ICON={hospital:'<path d="M4 21V5a1 1 0 0 1 1-1h8a1 1 0 0 1 1 1v16M14 11h5a1 1 0 0 1 1 1v9M2 21h20M8 8v4M6 10h4"/>',online:'<rect x="2" y="6" width="14" height="12" rx="2"/><path d="m22 8-6 4 6 4z"/>',home:'<path d="m3 11 9-8 9 8v10H3z"/><path d="M9 21v-6h6v6"/>'};
const pad=n=>String(n).padStart(2,'0');
const key=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const pd=v=>{const p=v.split('-').map(Number);return new Date(p[0],p[1]-1,p[2])};
const mins=t=>{const p=t.split(':').map(Number);return p[0]*60+p[1]};
const f12=t=>{const p=t.split(':').map(Number);return (p[0]%12||12)+':'+pad(p[1])+(p[0]<12?' AM':' PM')};
const wdOf=d=>(d.getDay()+6)%7+1;
const now=new Date(),today=new Date(now.getFullYear(),now.getMonth(),now.getDate());
let nid=10;
const S={hospital:'',repeat:'once',start:key(today),days:[wdOf(today)],endType:'never',endDate:'',weeks:4,off:{},msg:'',submitted:false,
types:{hospital:{on:true,fee:'500',slots:[{id:1,s:'09:00',e:'13:00'},{id:2,s:'17:00',e:'20:00'}]},online:{on:false,fee:'',slots:[{id:3,s:'20:00',e:'22:00'}]},home:{on:false,fee:'',slots:[{id:4,s:'14:00',e:'16:00'}]}}};
const sorted=sl=>sl.slice().sort((a,b)=>mins(a.s)-mins(b.s));
function slotError(sl){const s=sorted(sl);for(let i=0;i<s.length;i++){if(mins(s[i].e)<=mins(s[i].s))return 'Slot '+(i+1)+' end time must be after its start time.';if(i+1<s.length&&mins(s[i].e)>mins(s[i+1].s))return 'Slot '+(i+1)+' and Slot '+(i+2)+' overlap.'}return ''}
const times=k=>sorted(S.types[k].slots).map(s=>f12(s.s)+' – '+f12(s.e)).join(' & ');
function errors(){const e=[],act=META.filter(m=>S.types[m.key].on);if(!S.hospital)e.push('Select a hospital.');if(!act.length)e.push('Enable at least one type.');act.forEach(m=>{const t=S.types[m.key];if(t.fee==='')e.push(m.title+' fee is required.');const x=slotError(t.slots);if(x)e.push(m.title+': '+x)});if(S.repeat==='weekly'&&!S.days.length)e.push('Select at least one day.');return e}
function render(){
const st=S,startD=pd(st.start),act=META.filter(m=>st.types[m.key].on);
let h='<div style="height:56px;display:flex;align-items:center;padding:0 16px;background:#fff;border-bottom:1px solid #cfd9d6;font-weight:600;font-size:16px">Add Schedule</div><div style="padding:4px 16px 0">';
h+='<div class="sec">HOSPITAL</div><select class="inp" data-c="hospital" aria-label="Hospital"><option value="">Select a hospital</option>'+['City Care Hospital','Sunrise Multispeciality','Lotus Clinic'].map(x=>'<option'+(st.hospital===x?' selected':'')+'>'+x+'</option>').join('')+'</select>';
if(st.submitted&&!st.hospital)h+='<div class="err">Select a hospital.</div>';
h+='<div class="sec">REPEAT</div><div class="seg"><button data-a="once" class="'+(st.repeat==='once'?'on':'')+'">Once</button><button data-a="weekly" class="'+(st.repeat==='weekly'?'on':'')+'">Weekly</button></div>';
h+='<label class="field" style="margin-top:12px">'+(st.repeat==='once'?'Date':'Start date')+'<input class="inp" type="date" data-c="start" value="'+st.start+'"></label>';
if(st.repeat==='once')h+='<div style="font-size:12px;color:#51615d;margin-top:4px">'+FULL[wdOf(startD)-1]+'</div>';
else{h+='<div style="display:flex;gap:4px;margin-top:12px;justify-content:space-between">'+WD.map((w,i)=>'<button class="day'+(st.days.includes(i+1)?' on':'')+'" data-a="day" data-i="'+(i+1)+'" aria-label="'+FULL[i]+'">'+w+'</button>').join('')+'</div>';
h+='<div style="font-size:13px;font-weight:600;margin:16px 0 8px">Ends</div><div style="display:flex;gap:8px;flex-wrap:wrap">'+[['never','Never'],['onDate','On date'],['afterWeeks','After N weeks']].map(p=>'<button class="pill'+(st.endType===p[0]?' on':'')+'" data-a="end" data-t="'+p[0]+'">'+p[1]+'</button>').join('')+'</div>';
if(st.endType==='onDate')h+='<label class="field" style="margin-top:10px">End date<input class="inp" type="date" data-c="endDate" value="'+st.endDate+'"></label>';
if(st.endType==='afterWeeks')h+='<label class="field" style="margin-top:10px">Number of weeks<input class="inp" type="number" min="1" data-c="weeks" value="'+st.weeks+'"></label>'}
h+='<div class="sec">AVAILABLE FOR &amp; TIMINGS</div><div style="font-size:12px;color:#51615d;margin:-2px 0 10px 2px">Turn on a type, then set the timings for that type only.</div><div style="display:flex;flex-direction:column;gap:10px">';
META.forEach(m=>{const t=st.types[m.key];
h+='<div class="tcard'+(t.on?' on':'')+'"><div class="row"><div style="width:36px;height:36px;border-radius:10px;background:#e0f2ef;display:flex;align-items:center;justify-content:center;flex:none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#0f766e" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">'+ICON[m.key]+'</svg></div><div style="flex:1;min-width:0"><div style="font-size:14px;font-weight:600">'+m.title+'</div><div style="font-size:12px;color:#51615d">'+m.sub+'</div></div><button class="sw'+(t.on?' on':'')+'" data-a="tog" data-k="'+m.key+'" aria-label="'+m.title+'"><i></i></button></div>';
if(t.on){h+='<label class="field" style="margin-top:12px">Fee (₹)<input class="inp" type="number" min="0" placeholder="e.g. 500" data-c="fee" data-k="'+m.key+'" value="'+t.fee+'"></label>';
if(st.submitted&&t.fee==='')h+='<div class="err">Fee is required.</div>';
h+='<div style="font-size:13px;font-weight:600;margin-top:14px">Timings for '+m.title+'</div>';
sorted(t.slots).forEach((s,i)=>{h+='<div class="slot"><div class="row"><div style="font-size:12px;font-weight:600;color:#51615d;flex:1">Slot '+(i+1)+'</div>'+(t.slots.length>1?'<button class="del" data-a="del" data-k="'+m.key+'" data-id="'+s.id+'" aria-label="Delete slot"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>':'')+'</div><div style="display:flex;gap:8px"><label class="field" style="flex:1">Start<input class="inp" type="time" data-c="s" data-k="'+m.key+'" data-id="'+s.id+'" value="'+s.s+'"></label><label class="field" style="flex:1">End<input class="inp" type="time" data-c="e" data-k="'+m.key+'" data-id="'+s.id+'" value="'+s.e+'"></label></div></div>'});
const er=slotError(t.slots);if(er)h+='<div class="err">'+er+'</div>';
if(t.slots.length<4)h+='<button class="ghost" style="margin-top:10px" data-a="add" data-k="'+m.key+'">+ Add another slot</button>'}
h+='</div>'});
h+='</div>';if(st.submitted&&!act.length)h+='<div class="err">Enable at least one type.</div>';
const head=(st.repeat==='once'?startD.toDateString().slice(0,15):'Every '+st.days.slice().sort().map(d=>WD[d-1]).join(', ')+(st.endType==='never'?' · no end date':st.endType==='onDate'?(st.endDate?' · until '+st.endDate:' · choose an end date'):' · for '+st.weeks+' week'+(st.weeks==1?'':'s')))+' · '+(st.hospital||'Select a hospital');
h+='<div style="margin-top:16px;padding:14px;border-radius:12px;background:#e0f2ef;border:1px solid #9fd2cb;font-size:13px;line-height:1.5"><div style="font-weight:600;margin-bottom:4px">'+head+'</div>'+act.map(m=>'<div>'+m.title+': '+times(m.key)+(st.types[m.key].fee!==''?'  (₹'+st.types[m.key].fee+')':'')+'</div>').join('')+'</div>';
h+='<div class="sec">UPCOMING DAYS</div><div style="font-size:12px;color:#51615d;margin:-2px 0 8px 2px">Tap a type chip to switch it off for just that day. The rest of the series stays the same.</div>';
const first=startD>today?startD:today;let list=[];
if(st.repeat==='once'){if(first.getTime()===startD.getTime())list=[startD]}
else if(st.days.length){let endEx=new Date(9999,0,1);if(st.endType==='onDate'&&st.endDate){endEx=pd(st.endDate);endEx.setDate(endEx.getDate()+1)}if(st.endType==='afterWeeks'){endEx=new Date(startD);endEx.setDate(endEx.getDate()+(Number(st.weeks)||1)*7)}
for(let d=new Date(first);d<endEx&&list.length<5;d.setDate(d.getDate()+1))if(st.days.includes(wdOf(d)))list.push(new Date(d))}
if(!list.length)h+='<div style="font-size:13px">No upcoming days match this schedule.</div>';
h+='<div style="display:flex;flex-direction:column;gap:8px">'+list.map(d=>{const k=key(d),offN=act.filter(m=>st.off[k+m.key]).length,all=act.length&&offN===act.length;
return '<div class="card" style="padding:12px"><div class="row" style="justify-content:space-between"><div style="font-size:14px;font-weight:600">'+WD[wdOf(d)-1]+', '+d.getDate()+' '+d.toDateString().slice(4,7)+'</div><span class="badge'+(offN?' x':'')+'">'+(all?'On leave':offN?'Changed':'As scheduled')+'</span></div>'+act.map(m=>'<div class="row" style="margin-top:8px;gap:8px"><button class="chip'+(st.off[k+m.key]?' off':'')+'" data-a="chip" data-x="'+k+m.key+'">'+m.title+'</button><div style="font-size:12px;color:#51615d;flex:1">'+times(m.key)+'</div></div>').join('')+'</div>'}).join('')+'</div>';
h+='<button style="margin-top:20px;width:100%;height:52px;border:0;border-radius:26px;background:#0f766e;color:#fff;font:inherit;font-weight:600;font-size:15px;cursor:pointer" data-a="save">Save schedule</button>';
if(st.msg)h+='<div style="margin-top:10px;font-size:13px;text-align:center;color:'+(st.msg.startsWith('Schedule')?'#0b5a54':'#b42318')+'">'+st.msg+'</div>';
document.getElementById('app').innerHTML=h+'</div>'}
const app=document.getElementById('app');
app.addEventListener('click',e=>{const b=e.target.closest('[data-a]');if(!b)return;const a=b.dataset.a,k=b.dataset.k;
if(a==='once')S.repeat='once';
if(a==='weekly'){S.repeat='weekly';S.days=[wdOf(pd(S.start))]}
if(a==='day'){const i=+b.dataset.i;S.days=S.days.includes(i)?S.days.filter(x=>x!==i):S.days.concat([i])}
if(a==='end')S.endType=b.dataset.t;
if(a==='tog')S.types[k].on=!S.types[k].on;
if(a==='add'){const sl=sorted(S.types[k].slots),sm=Math.min(mins(sl[sl.length-1].e),1320),em=Math.min(sm+120,1439),f=n=>pad(Math.floor(n/60))+':'+pad(n%60);S.types[k].slots.push({id:++nid,s:f(sm),e:f(em)})}
if(a==='del')S.types[k].slots=S.types[k].slots.filter(x=>x.id!==+b.dataset.id);
if(a==='chip'){const x=b.dataset.x;if(S.off[x])delete S.off[x];else S.off[x]=true}
if(a==='save'){S.submitted=true;const er=errors();S.msg=er.length?er[0]:'Schedule saved (prototype)'}
render()});
app.addEventListener('change',e=>{const c=e.target.dataset.c;if(!c)return;const v=e.target.value,k=e.target.dataset.k,id=+e.target.dataset.id;
if(c==='hospital')S.hospital=v;
if(c==='start'&&v){S.start=v;if(S.repeat==='weekly')S.days=[wdOf(pd(v))]}
if(c==='endDate')S.endDate=v;
if(c==='weeks')S.weeks=v;
if(c==='fee')S.types[k].fee=v;
if(c==='s'||c==='e')S.types[k].slots.forEach(x=>{if(x.id===id)x[c]=v});
render()});
render();
</script>
</body>
</html>
